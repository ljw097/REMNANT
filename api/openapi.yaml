openapi: 3.1.0
info:
  title: ARTEX REMNANT Research API
  version: 0.1.0
  description: Source-first vulnerability research API. All routes require existing ARTEX JWT authentication.
servers:
  - url: /api/research
security:
  - BearerAuth: []
paths:
  /projects:
    get:
      summary: List research projects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
    post:
      summary: Create a source-research project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get project and policy
      responses:
        '200': { description: Project details }
        '404': { description: Not found }
    patch:
      summary: Update project metadata or selected LLM profile
      responses:
        '200': { description: Updated }
  /projects/{projectId}/targets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List pinned source targets
      responses:
        '200': { description: Target list }
    post:
      summary: Add an owned or explicitly authorized repository/local snapshot
      description: Remote source URI must pass the server-side repository-host allowlist and SSRF checks. Target is pinned to an immutable commit before analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTarget' }
      responses:
        '201': { description: Target created }
        '403': { description: Source policy denied }
  /patterns:
    get:
      summary: Search historical and reviewed root-cause patterns
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: vulnerability_class
          schema: { type: string }
      responses:
        '200': { description: Pattern list }
  /runs:
    get:
      summary: List research runs
      parameters:
        - in: query
          name: project_id
          schema: { type: integer, format: int64 }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200': { description: Run list }
    post:
      summary: Queue a source-only research run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRun' }
      responses:
        '202': { description: Queued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Scope or policy rejected }
  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Get run state, targets, patterns and counters
      responses:
        '200': { description: Run details }
        '404': { description: Not found }
  /runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Cancel a research run and terminate its workers
      responses:
        '202': { description: Cancellation requested }
  /runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Subscribe to run progress using Server-Sent Events
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /runs/{runId}/hypotheses:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: List hypotheses and evidence counts
      responses:
        '200': { description: Hypothesis list }
  /hypotheses/{hypothesisId}:
    parameters:
      - $ref: '#/components/parameters/HypothesisId'
    get:
      summary: Get hypothesis and evidence
      responses:
        '200': { description: Hypothesis detail }
    patch:
      summary: Human triage decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accepted, rejected, duplicate]
                reviewer_note: { type: string, maxLength: 8000 }
      responses:
        '200': { description: Updated }
  /hypotheses/{hypothesisId}/lab-approval:
    parameters:
      - $ref: '#/components/parameters/HypothesisId'
    post:
      summary: Request human approval for a local no-network lab test
      description: Creates a pending approval bound to exact target commit and policy hash. Does not execute the test.
      responses:
        '201': { description: Approval request created }
  /approvals/{approvalId}:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Approve or deny a pending local-lab validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, denied] }
                reviewer_note: { type: string, maxLength: 8000 }
      responses:
        '200': { description: Decision recorded }
        '409': { description: Approval stale because target revision or policy changed }
  /reports/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Get generated Markdown/JSON report metadata
      responses:
        '200': { description: Report metadata }
  /llm-profiles:
    get:
      summary: List existing ARTEX LLM profiles without exposing secrets
      responses:
        '200':
          description: Masked profile list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }
                    format: { type: string }
                    model: { type: string }
                    has_api_key: { type: boolean }
                    api_key_hint: { type: string }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    HypothesisId:
      name: hypothesisId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: Invalid request or policy rejected
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string }
  schemas:
    ProjectList:
      type: array
      items:
        type: object
        properties:
          id: { type: integer, format: int64 }
          name: { type: string }
          status: { type: string }
          llm_profile_id: { type: [integer, 'null'] }
    CreateProject:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 8000 }
        llm_profile_id: { type: integer, format: int64 }
        policy:
          type: object
          properties:
            source_mode: { const: read_only }
            dynamic_mode: { const: local_lab_only }
            network: { const: none }
    CreateTarget:
      type: object
      required: [kind, display_name, snapshot_key]
      properties:
        kind: { type: string, enum: [git_repository, local_snapshot, lab_fixture] }
        display_name: { type: string }
        source_uri: { type: string, description: Allow-listed repository URL only; no arbitrary URL targets }
        source_ref: { type: string }
        snapshot_key: { type: string, description: Server-issued storage key; never an absolute filesystem path }
    CreateRun:
      type: object
      required: [project_id, target_ids, pattern_ids, mode]
      properties:
        project_id: { type: integer, format: int64 }
        target_ids:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, format: int64 }
        pattern_ids:
          type: array
          maxItems: 100
          items: { type: integer, format: int64 }
        mode: { const: source_only }
        llm_profile_id: { type: integer, format: int64 }
        limits:
          type: object
          properties:
            max_workers: { type: integer, minimum: 1, maximum: 4, default: 2 }
            wall_seconds: { type: integer, minimum: 60, maximum: 3600, default: 900 }
            max_tokens: { type: integer, minimum: 1000, maximum: 50000, default: 12000 }
