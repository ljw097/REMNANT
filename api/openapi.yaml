openapi: 3.1.0
info:
  title: REMNANT Research API
  version: 1.0.0
  description: |
    Source-first vulnerability research API served by remnantd.
    Two ways to authenticate:
    - People sign in with a username and password (`POST /auth/login`); the server sets an HttpOnly,
      SameSite=Strict session cookie. Every state-changing request made with the cookie must send
      `X-Remnant-Request: 1` (and, if the browser sends Origin, come from the same origin).
    - Scripts use `Authorization: Bearer rmt_…` API tokens (`remnantd create-token`, or Settings → Users).
    Public routes: /healthz, GET /branding, GET /auth/status, POST /auth/login, POST /auth/request-account
    and /setup. A session that signed in with a temporary password can only change it
    (`403 password_change_required` elsewhere).
    Roles: admin (everything), researcher (create/run), reviewer (triage/approve).
    The instance policy (`/instance`) decides the approval rules: whether requesters may approve their own
    lab requests and authors review their own patterns (recorded as self_approved / self_reviewed),
    whether only administrators decide lab approvals, and whether people may request accounts.
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /me:
    get:
      summary: The authenticated principal
      responses:
        '200':
          description: Principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }

  /system/version:
    get:
      summary: Running version and updater state
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, examples: [v0.2.0, dev] }
                  commit: { type: string }
                  update: { $ref: '#/components/schemas/UpdateState' }
  /system/update:
    post:
      summary: Install the latest signed release now and restart (admin)
      description: |
        Checks the release source; if a newer release exists, downloads it, verifies the
        Ed25519 signature and checksums, swaps the binaries and restarts remnantd in place.
        Runs in progress are requeued by the shutdown and resume after the restart.
      responses:
        '202': { description: Installing; poll /system/version }
        '409': { description: Already up to date, or updates disabled (dev build or REMNANT_AUTO_UPDATE=off), $ref: '#/components/responses/Error' }
        '502': { description: The release source could not be read or did not verify, $ref: '#/components/responses/Error' }
  /llm-profiles:
    get:
      summary: List model profiles (never includes key material)
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LLMProfile' } }
    post:
      summary: Create a model profile (admin). The API key is encrypted at rest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLLMProfile' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/LLMProfile' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /llm-profiles/test:
    post:
      summary: Check unsaved profile settings (admin) — key, endpoint and model — without spending tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, api_key]
              properties:
                provider: { type: string, enum: [anthropic], default: anthropic }
                base_url: { type: string }
                model: { type: string }
                api_key: { type: string, writeOnly: true }
                options: { $ref: '#/components/schemas/ModelOptions' }
      responses:
        '200': { description: Result (ok false carries the reason), content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCheck' } } } }
  /llm-profiles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      summary: Edit a model profile (admin); a non-empty api_key replaces the stored key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                base_url: { type: string, maxLength: 2048 }
                model: { type: string, maxLength: 200 }
                effort: { type: string, enum: [low, medium, high, xhigh, max] }
                api_key: { type: string, writeOnly: true, description: Replaces the key; the old one cannot be recovered }
                options: { $ref: '#/components/schemas/ModelOptions' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/LLMProfile' } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a model profile (admin) that no project, agent or unfinished run uses
      responses:
        '204': { description: Deleted }
        '409': { description: In use, $ref: '#/components/responses/Error' }
  /llm-profiles/{id}/test:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Check a stored profile's key, endpoint and model (admin) without spending tokens
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCheck' } } } }
  /agents:
    get:
      summary: The pipeline's agents and their settings
      responses:
        '200': { description: Agents, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Agent' } } } } }
  /agents/{role}:
    parameters: [{ name: role, in: path, required: true, schema: { type: string, enum: [hypothesis_researcher, skeptic] } }]
    patch:
      summary: Change an agent (admin)
      description: llm_profile_id 0 returns the agent to the run's profile. Instructions are added after the agent's rules and cannot override them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                llm_profile_id: { type: integer, format: int64 }
                config: { $ref: '#/components/schemas/AgentConfig' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /settings/research:
    get:
      summary: Research settings, their defaults, and the server's configured static analyzers
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/ResearchSettings' }
                  defaults: { $ref: '#/components/schemas/ResearchSettings' }
                  static_operations: { type: array, items: { type: string } }
    put:
      summary: Change the research settings (admin); they apply to runs and requests started afterwards
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResearchSettings' } } }
      responses:
        '200': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /system/config:
    get:
      summary: The server's environment configuration (admin, read-only, no secrets)
      responses:
        '200': { description: Configuration, content: { application/json: { schema: { type: object } } } }

  /projects:
    get:
      summary: List projects with target and active-run counts
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
    post:
      summary: Create a project (researcher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Get a project
      responses:
        '200': { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update project fields (researcher). Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 8000 }
                status: { type: string, enum: [active, paused, archived] }
                llm_profile_id: { type: integer, format: int64 }
                clear_llm_profile: { type: boolean }
                policy: { $ref: '#/components/schemas/Policy' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /projects/{id}/targets:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: List targets of a project
      responses:
        '200':
          description: Targets
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Target' } }
    post:
      summary: Register a source target (researcher)
      description: |
        `local_snapshot` / `lab_fixture`: `snapshot_key` names a directory under
        `$REMNANT_DATA_DIR/snapshots`; it is pinned immediately to
        `sha256:<tree digest>` and becomes `ready`.
        `git_repository`: `source_uri` must be https on an allowlisted host
        (`REMNANT_REPO_HOSTS`) and `source_ref` a branch, tag or commit (default HEAD).
        The target is `pending` until the orchestrator's fetcher checks it out and pins
        the commit (`ready`), or `unavailable` with `metadata.fetch_error`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTarget' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Target' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { description: Repository host not allowlisted, $ref: '#/components/responses/Error' }
        '409': { description: Duplicate snapshot_key in project, $ref: '#/components/responses/Error' }
        '422': { description: Snapshot directory missing or not a directory, $ref: '#/components/responses/Error' }

  /patterns:
    get:
      summary: Search root-cause patterns
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: vulnerability_class, schema: { type: string } }
        - { in: query, name: language, schema: { type: string } }
      responses:
        '200':
          description: Up to 200 patterns, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Pattern' } }
    post:
      summary: Create a pattern (researcher). Starts unreviewed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePattern' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Pattern' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /patterns/{id}/review:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Review a pattern (reviewer)
      description: The author cannot review their own pattern unless the instance is in personal mode (recorded as self_reviewed). `validated` requires a validated hypothesis derived from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [reviewed, validated, rejected] }
      responses:
        '200': { description: Reviewed, content: { application/json: { schema: { $ref: '#/components/schemas/Pattern' } } } }
        '409': { $ref: '#/components/responses/Error' }

  /runs:
    get:
      summary: List runs
      parameters:
        - { in: query, name: project_id, schema: { type: integer, format: int64 } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/RunStatus' } }
      responses:
        '200':
          description: Up to 200 runs, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Run' } }
    post:
      summary: Queue a source-only run (researcher)
      description: Pins every target to its current revision and records the run scope hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRun' }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/RunDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: Project not active, $ref: '#/components/responses/Error' }
        '422': { description: Target not ready / not in project, unknown pattern, or no usable LLM profile, $ref: '#/components/responses/Error' }
  /runs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Run with pinned targets, patterns and hypothesis counts
      responses:
        '200': { description: Run, content: { application/json: { schema: { $ref: '#/components/schemas/RunDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /runs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Cancel a non-terminal run (researcher)
      responses:
        '202': { description: Cancelled }
        '409': { description: Run already terminal, $ref: '#/components/responses/Error' }
  /runs/{id}/pause:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Pause a waiting or running run (researcher)
      description: |
        Allowed while the run is queued, validation_approved, report_ready or in an automatic stage.
        An orchestrator working it stops at its next heartbeat (≤ 10 s). Recorded work is kept;
        an interrupted lab experiment is recorded as cancelled and spends its approval.
      responses:
        '202': { description: Paused }
        '409': { description: The run cannot be paused in its current status, $ref: '#/components/responses/Error' }
  /runs/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Resume a paused run (researcher)
      description: The run returns to resume_status and continues from resume_stage; completed stages are not repeated.
      responses:
        '202': { description: Resumed, content: { application/json: { schema: { $ref: '#/components/schemas/RunDetail' } } } }
        '409': { description: The run is not paused, $ref: '#/components/responses/Error' }
  /runs/{id}/finalize:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Move a reviewed run to report_ready (researcher or reviewer)
      description: The orchestrator then renders the JSON and Markdown report artifacts and completes the run.
      responses:
        '202': { description: Accepted }
        '409': { description: Run is not review_required, or lab approvals are still pending, $ref: '#/components/responses/Error' }
  /runs/{id}/experiments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Analyzer and lab experiments of a run
      responses:
        '200':
          description: Experiments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Experiment' } }
  /runs/{id}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: artifactId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      summary: Download artifact content stored by remnantd (indexes, reports)
      description: The `X-Content-SHA256` header carries the recorded digest. Worker artifacts whose bytes were never transferred return 404.
      responses:
        '200': { description: Artifact bytes with the artifact's media type }
        '404': { $ref: '#/components/responses/Error' }
  /runs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { in: header, name: Last-Event-ID, schema: { type: integer } }
      - { in: query, name: after, schema: { type: integer }, description: Same as Last-Event-ID, for clients that cannot set headers }
    get:
      summary: Server-Sent Events stream of the run timeline
      description: |
        Each event is `id: <event id>`, `event: <event_type>`, `data: <Event JSON>`.
        After a terminal run's last event the server sends `event: end` and closes.
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
  /runs/{id}/hypotheses:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Hypotheses of a run with evidence counts
      responses:
        '200':
          description: Hypotheses
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Hypothesis' } }
  /runs/{id}/artifacts:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Artifact manifest of a run
      responses:
        '200':
          description: Artifacts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Artifact' } }

  /hypotheses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Hypothesis with its evidence
      responses:
        '200': { description: Hypothesis, content: { application/json: { schema: { $ref: '#/components/schemas/HypothesisDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Human decision on a hypothesis (reviewer)
      description: |
        accepted / rejected / duplicate apply to draft or triage hypotheses.
        validated requires a lab experiment for the hypothesis that ended in `finding`;
        not_reproducible requires one that finished. Both apply to validation_pending hypotheses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, rejected, duplicate, validated, not_reproducible] }
                reviewer_note: { type: string, maxLength: 8000 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/HypothesisDetail' } } } }
        '409': { description: Decision not allowed in the current status, or no supporting lab experiment, $ref: '#/components/responses/Error' }
  /hypotheses/{id}/lab-approval:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Request approval for a local, no-network lab experiment (researcher)
      description: |
        Requires an accepted hypothesis, a run in `review_required`, an unchanged
        target revision and a project policy with `dynamic_mode: local_lab_only`.
        Creates a pending approval bound to a scope hash; it never runs anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, summary]
              properties:
                operation: { type: string, enum: [lab.unit_test, lab.asan_test, lab.ubsan_test, lab.libfuzzer] }
                summary: { type: string, maxLength: 8000 }
                limits: { $ref: '#/components/schemas/LabLimits' }
      responses:
        '201': { description: Pending approval, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '403': { description: Project policy disables dynamic testing, $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /approvals/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Approve or deny a pending lab approval (reviewer; never the requester, except in personal mode, where it is recorded as self_approved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, denied] }
                reviewer_note: { type: string, maxLength: 8000 }
      responses:
        '200': { description: Decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '403': { description: Requester tried to decide their own request, $ref: '#/components/responses/Error' }
        '409': { description: Already decided, or stale (expired, revision/scope/policy changed) — a stale approval is marked expired, $ref: '#/components/responses/Error' }

  /auth/status:
    get:
      summary: Who is signed in (by session cookie), and whether setup or account requests are open (public)
      security: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { oneOf: [{ $ref: '#/components/schemas/Principal' }, { type: 'null' }] }
                  setup_required: { type: boolean }
                  account_requests: { type: boolean }
                  presets: { type: object, additionalProperties: { $ref: '#/components/schemas/InstancePolicy' } }
  /auth/login:
    post:
      summary: Sign in with a username and password (public); sets the session cookie
      description: |
        Rate-limited per client. Ten wrong passwords in a row lock the account for 15 minutes.
        Sessions end after the policy's inactivity period and after 30 days at most.
      security: []
      parameters: [{ $ref: '#/components/parameters/SameOrigin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } }
      responses:
        '200': { description: Signed in; Set-Cookie remnant_session, content: { application/json: { schema: { $ref: '#/components/schemas/Principal' } } } }
        '401': { description: Wrong username or password, $ref: '#/components/responses/Error' }
        '403': { description: Account request not yet approved (code pending), or missing X-Remnant-Request, $ref: '#/components/responses/Error' }
        '429': { description: Locked (code locked) or rate-limited, $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: End the current session and clear the cookie
      responses:
        '204': { description: Signed out }
  /auth/request-account:
    post:
      summary: Ask for an account (public; only when the policy takes account requests)
      description: Creates a pending researcher account that cannot sign in until an administrator approves it.
      security: []
      parameters: [{ $ref: '#/components/parameters/SameOrigin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string, minLength: 10 } } }
      responses:
        '202': { description: Pending approval }
        '403': { description: Account requests are off, $ref: '#/components/responses/Error' }
        '409': { description: Username taken, $ref: '#/components/responses/Error' }
  /me/password:
    put:
      summary: Change your password; signs out your other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 256 }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Error' }
        '403': { description: The current password is wrong, $ref: '#/components/responses/Error' }
  /setup:
    get:
      summary: Same as GET /auth/status (kept for older clients)
      security: []
      responses:
        '200': { description: Status }
    post:
      summary: Create the first administrator and set the instance policy (public, once); signs them in
      description: |
        Needs the one-time setup code remnantd prints to its log while no users exist (valid 24 h;
        10 wrong attempts burn it). Works only while there are no users. `remnantd setup -profile …`
        does the same from the command line.
      security: []
      parameters: [{ $ref: '#/components/parameters/SameOrigin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, username, password, policy]
              properties:
                code: { type: string }
                username: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
                password: { type: string, minLength: 10, maxLength: 256 }
                instance_name: { type: string, maxLength: 60 }
                policy: { $ref: '#/components/schemas/InstancePolicy' }
      responses:
        '201':
          description: Set up and signed in (Set-Cookie remnant_session)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Principal' }
                  policy: { $ref: '#/components/schemas/InstancePolicy' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { description: Wrong or expired setup code, $ref: '#/components/responses/Error' }
        '409': { description: Setup already done, $ref: '#/components/responses/Error' }
  /instance:
    get:
      summary: The instance policy and the profile presets
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: '#/components/schemas/InstancePolicy' }
                  presets: { type: object, additionalProperties: { $ref: '#/components/schemas/InstancePolicy' } }
    put:
      summary: Change the instance policy (admin)
      description: Applies to decisions made afterwards; past self-approvals stay recorded. A policy whose rules differ from its profile's preset is stored as profile custom.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [policy], properties: { policy: { $ref: '#/components/schemas/InstancePolicy' } } } } }
      responses:
        '200': { description: Changed }
        '422': { $ref: '#/components/responses/Error' }
  /branding:
    get:
      summary: Organization branding (public; the sign-in page shows it)
      security: []
      responses:
        '200': { description: Branding, content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } } }
    put:
      summary: Set organization branding (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /me/preferences:
    get:
      summary: The caller's web UI preferences (an object the UI owns; {} when unset)
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { type: object } } } }
    put:
      summary: Replace the caller's web UI preferences (JSON object, at most 16 KiB)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
  /summary:
    get:
      summary: Counts for the dashboard
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/Summary' } } } }
  /approvals:
    get:
      summary: List lab approvals across runs, newest first
      parameters:
        - { in: query, name: decision, schema: { type: string, enum: [pending, approved, denied, expired, revoked] } }
      responses:
        '200': { description: Approvals, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApprovalItem' } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /hypotheses:
    get:
      summary: Hypotheses across runs, newest first (up to 200)
      parameters:
        - in: query
          name: status
          description: Comma-separated statuses
          schema: { type: string, examples: ['triage,validation_pending'] }
      responses:
        '200': { description: Hypotheses, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Hypothesis' } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /users:
    get:
      summary: List users (names and roles only)
      responses:
        '200': { description: Users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserRef' } } } } }
    post:
      summary: Create a user (admin)
      description: Without a password, a temporary one is generated and returned once; the user must change it at the first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
                role: { type: string, enum: [admin, researcher, reviewer] }
                password: { type: string, minLength: 10, maxLength: 256 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { user: { type: object }, temporary_password: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      summary: Change a user's role, disable them, or approve an account request (admin)
      description: The last active administrator cannot be demoted or disabled. Disabling signs the user out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, researcher, reviewer] }
                disabled: { type: boolean }
                approve: { type: boolean, description: Approve a pending account request }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UserRef' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Decline a pending account request (admin); active accounts are disabled instead
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}/password:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Reset a user's password (admin); returns a temporary password once and signs them out
      responses:
        '200': { description: Reset, content: { application/json: { schema: { type: object, properties: { temporary_password: { type: string } } } } } }
  /users/{id}/tokens:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Issue an API token for a user's scripts (admin); shown once
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, default: api }
                ttl_hours: { type: integer, minimum: 0, maximum: 8784, description: 0 means no expiry }
      responses:
        '201': { description: Token, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /patterns/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: One pattern
      responses:
        '200': { description: Pattern, content: { application/json: { schema: { $ref: '#/components/schemas/Pattern' } } } }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    SameOrigin: { name: X-Remnant-Request, in: header, required: true, schema: { const: '1' }, description: Proves the request is not a cross-site form post }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [bad_request, unauthorized, forbidden, not_found, conflict, invalid, source_policy, snapshot_unavailable, update_source, internal, pending, locked, rate_limited, password_change_required, bad_host] }
  schemas:
    Principal:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, researcher, reviewer] }
        must_change_password: { type: boolean }
    UpdateState:
      type: object
      properties:
        current: { type: string }
        mode: { type: string, enum: [off, check, install] }
        latest: { type: string }
        release_url: { type: string }
        available: { type: boolean }
        status: { type: string, enum: [idle, checking, installing, restarting, disabled] }
        last_checked: { type: string, format: date-time }
        last_error: { type: string }
    LLMProfile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        provider: { type: string, enum: [anthropic] }
        base_url: { type: string }
        model: { type: string }
        effort: { type: string, enum: [low, medium, high, xhigh, max] }
        has_api_key: { type: boolean }
        api_key_hint: { type: string, description: 'Last four characters, e.g. "…a1B2"' }
        options: { $ref: '#/components/schemas/ModelOptions' }
        used_by: { type: integer, description: Projects and agents that use the profile }
        updated_at: { type: string, format: date-time }
    CreateLLMProfile:
      type: object
      additionalProperties: false
      required: [name, provider, model, api_key]
      properties:
        name: { type: string, maxLength: 120 }
        provider: { type: string, enum: [anthropic] }
        base_url: { type: string, description: Optional API base URL override }
        model: { type: string, examples: [claude-opus-5-5] }
        effort: { type: string, enum: [low, medium, high, xhigh, max], default: high }
        api_key: { type: string, writeOnly: true }
        options: { $ref: '#/components/schemas/ModelOptions' }
    Policy:
      type: object
      required: [source_mode, dynamic_mode, network]
      properties:
        source_mode: { const: read_only }
        dynamic_mode: { type: string, enum: [disabled, local_lab_only], default: disabled }
        network: { const: none }
    Project:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, paused, archived] }
        llm_profile_id: { type: [integer, 'null'], format: int64 }
        policy: { $ref: '#/components/schemas/Policy' }
        target_count: { type: integer }
        active_runs: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 8000 }
        llm_profile_id: { type: integer, format: int64 }
        policy: { $ref: '#/components/schemas/Policy' }
    Target:
      type: object
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        kind: { type: string, enum: [git_repository, local_snapshot, lab_fixture] }
        display_name: { type: string }
        source_uri: { type: string }
        source_ref: { type: string }
        snapshot_key: { type: string }
        revision: { type: string, description: 'Git commit SHA or "sha256:<tree digest>"' }
        tree_sha256: { type: string }
        primary_language: { type: string }
        status: { type: string, enum: [pending, ready, unavailable, quarantined] }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
    CreateTarget:
      type: object
      additionalProperties: false
      required: [kind, display_name, snapshot_key]
      properties:
        kind: { type: string, enum: [git_repository, local_snapshot, lab_fixture] }
        display_name: { type: string, maxLength: 200 }
        source_uri: { type: string, description: git_repository only; https on an allowlisted host }
        source_ref: { type: string, maxLength: 255 }
        snapshot_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$' }
        primary_language: { type: string, maxLength: 40 }
    Pattern:
      type: object
      properties:
        id: { type: integer, format: int64 }
        parent_pattern_id: { type: [integer, 'null'] }
        source_kind: { type: string, enum: [historical, validated_internal, researcher_authored] }
        source_ref: { type: string }
        title: { type: string }
        vulnerability_class: { type: string }
        cwe_id: { type: string }
        language: { type: string }
        root_cause: { type: string }
        preconditions: { type: array, items: { type: string } }
        lifecycle_points: { type: array, items: { type: string } }
        code_signatures: { type: array, items: { type: string } }
        counter_signatures: { type: array, items: { type: string } }
        patch_semantics: { type: object }
        version: { type: integer }
        validation_status: { type: string, enum: [unreviewed, reviewed, validated, rejected] }
        created_by: { type: [integer, 'null'] }
        reviewed_by: { type: [integer, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        self_reviewed: { type: boolean, description: Reviewed by its own author in personal mode }
        created_at: { type: string, format: date-time }
    CreatePattern:
      type: object
      additionalProperties: false
      required: [title, vulnerability_class, root_cause]
      properties:
        source_kind: { type: string, enum: [historical, researcher_authored], default: researcher_authored }
        source_ref: { type: string, description: Advisory/CVE/patch reference }
        title: { type: string, maxLength: 300 }
        vulnerability_class: { type: string, maxLength: 100 }
        cwe_id: { type: string, maxLength: 20 }
        language: { type: string, maxLength: 40 }
        root_cause: { type: string, maxLength: 20000 }
        preconditions: { type: array, items: { type: string } }
        lifecycle_points: { type: array, items: { type: string } }
        code_signatures: { type: array, items: { type: string } }
        counter_signatures: { type: array, items: { type: string } }
        patch_semantics: { type: object }
    RunStatus:
      type: string
      enum: [queued, collecting, indexing, surface_mapping, hypothesis_generation, static_validation, review_required, validation_approved, lab_validation, report_ready, paused, completed, cancelled, failed, timed_out]
    Limits:
      type: object
      properties:
        max_workers: { type: integer, minimum: 1, maximum: 4, default: 2 }
        wall_seconds: { type: integer, minimum: 60, maximum: 3600, default: 900 }
        max_tokens: { type: integer, minimum: 4000, maximum: 2000000, default: 200000, description: Output-token budget (thinking included) across every model call of the run, including earlier attempts }
    CreateRun:
      type: object
      additionalProperties: false
      required: [project_id, target_ids]
      properties:
        project_id: { type: integer, format: int64 }
        target_ids: { type: array, minItems: 1, maxItems: 10, items: { type: integer, format: int64 } }
        pattern_ids: { type: array, maxItems: 100, items: { type: integer, format: int64 } }
        llm_profile_id: { type: integer, format: int64, description: Defaults to the project's profile }
        limits: { $ref: '#/components/schemas/Limits' }
    Run:
      type: object
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/RunStatus' }
        mode: { const: source_only }
        limits: { $ref: '#/components/schemas/Limits' }
        policy: { $ref: '#/components/schemas/Policy' }
        scope_hash: { type: string }
        llm_profile_id: { type: [integer, 'null'] }
        started_by: { type: [integer, 'null'] }
        error_summary: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        resume_stage: { type: string, description: Source stage the run continues from after a pause or interruption; empty when none }
        resume_status: { type: string, description: Status a paused run returns to when resumed; empty unless paused }
        attempts: { type: integer, description: Times the run was recovered after its orchestrator died (failed after 3) }
        active_ms: { type: integer, description: Time spent in automatic source stages; wall_seconds applies to this }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          properties:
            targets:
              type: array
              items:
                type: object
                properties:
                  target_id: { type: integer, format: int64 }
                  revision: { type: string }
            pattern_ids: { type: array, items: { type: integer, format: int64 } }
            hypothesis_counts: { type: object, additionalProperties: { type: integer } }
    Hypothesis:
      type: object
      properties:
        id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        pattern_id: { type: [integer, 'null'] }
        title: { type: string }
        claim: { type: string }
        vulnerability_class: { type: string }
        cwe_id: { type: string }
        status: { type: string, enum: [draft, triage, accepted, rejected, validation_pending, validated, not_reproducible, duplicate] }
        triage_confidence: { type: string, enum: [low, medium, high] }
        skeptic_verdict: { type: string, enum: ['', supports, weakens, refutes] }
        facts: { type: array, items: { type: string } }
        preconditions: { type: array, items: { type: string } }
        unknowns: { type: array, items: { type: string } }
        affected_symbols: { type: array, items: { type: string } }
        expected_observation: { type: string }
        counter_evidence: { type: array, items: { type: string } }
        reviewer_note: { type: string }
        reviewed_by: { type: [integer, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        evidence_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Evidence:
      type: object
      properties:
        id: { type: integer, format: int64 }
        hypothesis_id: { type: [integer, 'null'] }
        target_id: { type: integer, format: int64 }
        evidence_kind: { type: string, enum: [source_location, call_path, data_flow, static_finding, build_result, runtime_observation, counter_evidence, external_reference] }
        source_uri: { type: string }
        file_path: { type: string }
        line_start: { type: [integer, 'null'] }
        line_end: { type: [integer, 'null'] }
        symbol: { type: string }
        revision: { type: string }
        content_sha256: { type: string }
        summary: { type: string }
        excerpt: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
    HypothesisDetail:
      allOf:
        - $ref: '#/components/schemas/Hypothesis'
        - type: object
          properties:
            evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
    LabLimits:
      type: object
      properties:
        wall_seconds: { type: integer, minimum: 1, maximum: 3600, default: 300 }
        memory_mb: { type: integer, minimum: 64, maximum: 16384, default: 2048 }
        cpu_cores: { type: integer, minimum: 1, maximum: 8, default: 2 }
        max_processes: { type: integer, minimum: 1, maximum: 256, default: 32 }
    Approval:
      type: object
      properties:
        id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        hypothesis_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        action_class: { const: local_lab_validation }
        target_revision: { type: string }
        scope:
          type: object
          description: The exact scope being approved; scope_hash is SHA-256 of this object.
          properties:
            action_class: { type: string }
            operation: { type: string }
            run_scope_hash: { type: string }
            hypothesis_id: { type: integer }
            target_id: { type: integer }
            revision: { type: string }
            network: { const: none }
            limits: { $ref: '#/components/schemas/LabLimits' }
        scope_hash: { type: string }
        request_summary: { type: string }
        decision: { type: string, enum: [pending, approved, denied, expired, revoked] }
        requested_by: { type: integer, format: int64 }
        decided_by: { type: [integer, 'null'] }
        reviewer_note: { type: string }
        decided_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        self_approved: { type: boolean, description: Decided by its own requester in personal mode }
    Artifact:
      type: object
      properties:
        id: { type: integer, format: int64 }
        experiment_id: { type: [integer, 'null'] }
        artifact_kind: { type: string }
        name: { type: string }
        sha256: { type: string }
        size_bytes: { type: integer }
        media_type: { type: string }
        classification: { type: string, enum: [research_internal, sensitive, redacted] }
        created_at: { type: string, format: date-time }
    Experiment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        hypothesis_id: { type: [integer, 'null'] }
        approval_id: { type: [integer, 'null'] }
        target_id: { type: [integer, 'null'] }
        operation: { type: string }
        request_id: { type: string }
        status: { type: string, enum: [queued, running, passed, finding, failed, resource_limited, cancelled] }
        network_mode: { const: none }
        workspace_revision: { type: string }
        config: { type: object }
        result_summary: { type: string }
        exit_code: { type: [integer, 'null'] }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Event:
      type: object
      properties:
        id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        event_type:
          type: string
          examples: [run.queued, run.status, stage.collected, stage.indexed, stage.mapped, stage.generated, stage.skipped,
                     hypothesis.created, hypothesis.challenged, hypothesis.triaged, agent.refused, agent.invalid_output, agent.error,
                     experiment.finished, approval.requested, approval.decided, approval.revoked, report.generated]
        stage: { type: string }
        message: { type: string }
        payload: { type: object }
        created_at: { type: string, format: date-time }
    InstancePolicy:
      type: object
      properties:
        profile: { type: string, enum: [personal, team, managed, custom] }
        self_approval: { type: boolean, description: The requester may decide their own lab approval (recorded) }
        self_review: { type: boolean, description: A pattern's author may review it (recorded) }
        admin_lab_approval: { type: boolean, description: Only administrators decide lab approvals }
        account_requests: { type: boolean, description: People may request an account on the sign-in page }
        session_hours: { type: integer, minimum: 1, maximum: 720, description: Sign out after this long without activity }
    Branding:
      type: object
      properties:
        name: { type: string, maxLength: 60, description: Shown instead of REMNANT; empty keeps the default }
        accent: { type: string, pattern: '^(#[0-9a-fA-F]{6})?$' }
    Summary:
      type: object
      properties:
        projects: { type: integer }
        targets: { type: integer }
        active_runs: { type: integer }
        paused_runs: { type: integer }
        awaiting_triage: { type: integer }
        pending_approvals: { type: integer }
        validation_pending: { type: integer }
        validated: { type: integer }
        runs_by_status: { type: object, additionalProperties: { type: integer } }
        generated_at: { type: string, format: date-time }
    ApprovalItem:
      allOf:
        - $ref: '#/components/schemas/Approval'
        - type: object
          properties:
            project_id: { type: integer, format: int64 }
            hypothesis_title: { type: string }
            requested_by_name: { type: string }
    UserRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, researcher, reviewer] }
        disabled: { type: boolean }
        pending: { type: boolean }
        has_password: { type: boolean }
    ModelOptions:
      type: object
      properties:
        thinking: { type: string, enum: ['', adaptive, disabled], description: Empty keeps the model default }
        timeout_seconds: { type: integer, minimum: 0, maximum: 900, description: Per request attempt; 0 is the SDK default (else 10–900) }
        max_retries: { type: [integer, 'null'], minimum: 0, maximum: 10, description: null is the SDK default }
    ProfileCheck:
      type: object
      properties:
        ok: { type: boolean }
        model: { type: string, description: The model's display name }
        error: { type: string }
    AgentConfig:
      type: object
      properties:
        instructions: { type: string, maxLength: 4000 }
        max_call_tokens: { type: integer, description: 0 keeps the instance setting, else 2048–32000 }
    Agent:
      type: object
      properties:
        role: { type: string, enum: [hypothesis_researcher, skeptic] }
        display_name: { type: string }
        enabled: { type: boolean }
        llm_profile_id: { type: [integer, 'null'] }
        config: { $ref: '#/components/schemas/AgentConfig' }
        updated_at: { type: string, format: date-time }
    ResearchSettings:
      type: object
      properties:
        run_defaults: { $ref: '#/components/schemas/Limits' }
        candidates_per_pattern: { type: integer, minimum: 1, maximum: 10 }
        max_candidates: { type: integer, minimum: 1, maximum: 100 }
        max_call_tokens: { type: integer, minimum: 2048, maximum: 32000 }
