name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "release tags are vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release tags must point at main"; exit 1; }
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        run: scripts/release-build.sh "$GITHUB_REF_NAME"
      - name: Sign
        env:
          REMNANT_RELEASE_SIGNING_KEY: ${{ secrets.REMNANT_RELEASE_SIGNING_KEY }}
        run: |
          go run ./cmd/remnant-release sign dist/SHA256SUMS
          go run ./cmd/remnant-release verify dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "REMNANT $GITHUB_REF_NAME" --generate-notes --verify-tag
